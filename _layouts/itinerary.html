---
layout: default
---

<div class="travel-scene">

  <div
    class="travel-hero"
    style="background-image:url('{{ page.header.image | relative_url }}');"
  >
    <div class="travel-hero__overlay">

      <div class="travel-hero__text">

        {% assign parts = page.title | split: ", " %}

        <h1>{{ parts[0] }}</h1>

        {% if parts.size > 1 %}
        <p>
          {% for part in parts offset:1 %}
            {{ part }}{% unless forloop.last %}, {% endunless %}
          {% endfor %}
        </p>
        {% endif %}

      </div>

    </div>
    
  </div>

  <div class="travel-scroll-space"></div>

  <div id="main" role="main">

    <article class="page travel-page">

      <div class="page__inner-wrap">

        <section
          class="page__content travel-content reveal"
          itemprop="text"
        >
{{ content }}

<!-- ITINERARY-LOCATION-FOOTER-HIDE -->
<style>
.itinerary-location--footer-hidden {
  opacity: 0 !important;
  visibility: hidden !important;
  pointer-events: none !important;
  transition: opacity .18s ease, visibility .18s ease !important;
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const footer = document.querySelector(".page__footer, footer");
  if (!footer) return;

  const story = document.querySelector(".itinerary-story");
  const headings = Array.from(document.querySelectorAll("h1, h2, h3")).filter(function (heading) {
    if (heading.closest(".itinerary-story, .masthead, .page__footer, footer")) return false;
    const text = heading.textContent.replace(/\s+/g, " ").trim();
    return text.length > 0 && text.length < 55;
  });
  const locationHeading = headings[headings.length - 1];
  if (!locationHeading) return;

  const labelElements = [locationHeading];
  const parent = locationHeading.parentElement;
  if (parent) {
    Array.from(parent.children).forEach(function (child) {
      if (child === locationHeading) return;
      const text = child.textContent.replace(/\s+/g, " ").trim();
      if (text && text.length < 55 && !child.querySelector("img, video")) labelElements.push(child);
    });
  }

  const observer = new IntersectionObserver(function (entries) {
    const hide = entries[0].isIntersecting;
    labelElements.forEach(function (element) {
      element.classList.toggle("itinerary-location--footer-hidden", hide);
    });
  }, { rootMargin: "140px 0px 0px 0px", threshold: 0 });

  observer.observe(footer);
});
</script>

        </section>

      </div>

    </article>

  </div>

</div>

<script>

const hero = document.querySelector(".travel-hero");
const article = document.querySelector(".travel-page");

function updateScene(){

    const h = window.innerHeight;

    const progress = Math.min(
        window.scrollY / (h * 0.25),
        1
    );

    hero.style.setProperty(
        "--hero-opacity",
        1
    );

    article.style.setProperty(
        "--article-opacity",
        progress
    );
}

updateScene();

window.addEventListener("scroll",updateScene);
window.addEventListener("resize",updateScene);

const observer = new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);

        }

    });

},{
    threshold:0.15
});

document
.querySelectorAll(".reveal")
.forEach(el=>observer.observe(el));

</script>
