---
layout: default
---

<div class="travel-scene">

  <div
    class="travel-hero"
    style="background-image:url('{{ page.header.image | relative_url }}');"
  >
    <div class="travel-hero__overlay">

      <div class="travel-hero__text">

        {% assign parts = page.title | split: ", " %}

        <h1>{{ parts[0] }}</h1>

        {% if parts.size > 1 %}
        <p>
          {% for part in parts offset:1 %}
            {{ part }}{% unless forloop.last %}, {% endunless %}
          {% endfor %}
        </p>
        {% endif %}

      </div>

    </div>

    <div class="travel-mask"></div>

  </div>

  <div class="travel-scroll-space"></div>

  <div id="main" role="main">

    <article class="page travel-page">

      <div class="page__inner-wrap">

        <section
          class="page__content travel-content reveal"
          itemprop="text"
        >
          {{ content }}
        </section>

      </div>

    </article>

  </div>

</div>

<script>

const hero = document.querySelector(".travel-hero");
const article = document.querySelector(".travel-page");

function updateScene(){

    const h = window.innerHeight;

    const progress = Math.min(
        window.scrollY / (h * 0.8),
        1
    );

    hero.style.setProperty(
        "--hero-opacity",
        1 - progress
    );

    article.style.setProperty(
        "--article-opacity",
        progress
    );
  
    if(progress > 0.95){
      document.body.classList.add("travel-reading");
    }else{
      document.body.classList.remove("travel-reading");
    }
}

updateScene();

window.addEventListener("scroll",updateScene);
window.addEventListener("resize",updateScene);

const observer = new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

        if(entry.isIntersecting){

            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);

        }

    });

},{
    threshold:0.15
});

document
.querySelectorAll(".reveal")
.forEach(el=>observer.observe(el));

</script>
