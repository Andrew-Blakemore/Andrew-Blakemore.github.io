```html
---
layout: default
---

<div class="travel-hero"
     style="background-image: url('{{ page.header.image | relative_url }}');">
  <div class="travel-hero__overlay">
    <div class="travel-hero__text">

      {% assign parts = page.title | split: ", " %}

      <h1>{{ parts[0] }}</h1>

      {% if parts.size > 1 %}
      <p>
        {% for part in parts offset:1 %}
          {{ part }}{% unless forloop.last %}, {% endunless %}
        {% endfor %}
      </p>
      {% endif %}

    </div>
  </div>
</div>

<div id="main" role="main">

  <article class="page travel-page"
           itemscope
           itemtype="https://schema.org/CreativeWork">

    <div class="page__inner-wrap">

      <section
        class="page__content travel-content"
        itemprop="text">

        {{ content }}

      </section>

    </div>

  </article>

</div>

<script>

const hero = document.querySelector(".travel-hero");
const content = document.querySelector(".travel-content");

const fadeDistance = window.innerHeight * 0.65;

window.addEventListener("scroll", () => {

    const progress = Math.min(window.scrollY / fadeDistance, 1);

    hero.style.opacity = 1 - progress;

    content.style.opacity = progress;

    content.style.transform =
        `translateY(${40 - progress * 40}px)`;

});

const observer = new IntersectionObserver((entries) => {

    entries.forEach(entry => {

        if(entry.isIntersecting){

            entry.target.classList.add("is-visible");

            observer.unobserve(entry.target);

        }

    });

},{threshold:0.15});

document
    .querySelectorAll(".reveal")
    .forEach(el => observer.observe(el));

</script>
```
